[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordlistxpl-forge"
version = "2.0.0"
description = "WordlistXPL-Forge. Wordlist generation toolkit for authorized pentest and red team operations. Member of the XPL-Forge suite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "André Henrique", email = "suporte@uniaogeek.com.br"},
]
maintainers = [
    {name = "André Henrique", email = "suporte@uniaogeek.com.br"},
]
keywords = [
    "wordlist", "password", "pentest", "red-team", "security",
    "xpl-forge", "osint", "credential", "default-credentials",
    "pcfg", "markov", "keyboard-walk", "hashcat-rules",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "colorama>=0.4.6",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "chardet>=5.2.0",
    "unidecode>=1.3.6",
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7.0",
    "Pillow>=10.0.0",
]
docs = [
    "openpyxl>=3.1.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "striprtf>=0.0.26",
]
scrape = [
    "pypdf>=4.0.0",
]
neural = [
    "torch>=2.0",
    "transformers>=4.40",
]
gpu = [
    "torch>=2.0",
    "transformers>=4.40",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]
full = [
    "wordlistxpl-forge[ocr,docs,scrape,neural,gpu,api]",
]

[project.urls]
Homepage = "https://github.com/mrhenrike/WordlistXPL-Forge"
Documentation = "https://github.com/mrhenrike/WordlistXPL-Forge/wiki"
Repository = "https://github.com/mrhenrike/WordlistXPL-Forge"
Issues = "https://github.com/mrhenrike/WordlistXPL-Forge/issues"
Changelog = "https://github.com/mrhenrike/WordlistXPL-Forge/releases"

[project.scripts]
wlf = "wlf:main"

[tool.setuptools]
py-modules = ["wlf"]

[tool.setuptools.packages.find]
include = ["wlf*", "wlf_modules*"]

[tool.mypy]
python_version = "3.12"
strict = true
implicit_reexport = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "psutil",
    "colorama",
    "tqdm",
    "yaml",
    "torch", "torch.*",
    "transformers",
    "fastapi", "fastapi.*",
    "uvicorn",
    "pydantic",
    "easyocr",
    "aiohttp",
]
ignore_missing_imports = true

[tool.setuptools.package-data]
"wlf_modules" = ["data/*.json", "py.typed"]
"wlf" = ["py.typed"]
