version: "3.9"

services:
  wlf-api:
    build:
      context: .
      target: full
    ports:
      - "8771:8771"
    entrypoint: ["python", "wlf.py", "serve", "--host", "0.0.0.0", "--port", "8771"]
    restart: unless-stopped
    environment:
      - WLF_API_KEY=${WLF_API_KEY:-}
    volumes:
      - wlf-output:/out

  wlf-cli:
    build:
      context: .
      target: core
    profiles: ["cli"]
    volumes:
      - wlf-output:/out

volumes:
  wlf-output:
